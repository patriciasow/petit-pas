/* ----- 12. Conseils ----- */
function vTips() {
  const c = Repo.active(), m = c ? monthsBetween(c.birthDate) : 0;
  let list = CONTENTS.slice();
  if (UI.tipCat !== "Toutes") list = list.filter(x => x.category === UI.tipCat);
  const fits = x => m >= x.ageMin && m <= x.ageMax;
  list.sort((a, b) => (fits(b) - fits(a)) || ((isSpecial(c) && ["Prématurité", "Faible poids"].includes(b.category)) - (isSpecial(c) && ["Prématurité", "Faible poids"].includes(a.category))));
  const cats = ["Toutes", ...(isSpecial(c) ? ["Prématurité", "Faible poids"] : []), ...CATS.filter(x => !(isSpecial(c) && ["Prématurité", "Faible poids"].includes(x)))];
  return `<div class="page">${header("Conseils pour les parents", { right: netChip() })}<div class="pad stack" style="gap:14px">
  <div class="notice">${ic("info")}<span>Informations générales. Les contenus médicaux sont à faire valider par des professionnels de santé avant le déploiement.</span></div>
  <div class="scroller" role="group" aria-label="Catégories">${cats.map(k => `<button class="chip" aria-pressed="${UI.tipCat === k}" data-act="tip-cat" data-k="${esc(k)}">${k}</button>`).join("")}</div>
  ${list.map(x => { const off = !Net.online && !isDl(x.id); return `<article class="cardlink" style="gap:8px;${off ? "opacity:.78" : ""}"><div class="meta"><span class="badge ${["Prématurité", "Faible poids"].includes(x.category) ? "care" : "ok"}">${x.category}</span>${c && fits(x) ? `<span class="badge warn">${ic("star")}Pour ${esc(c.firstName)}</span>` : ""}</div>
    <h3>${x.title}</h3><p class="small muted">${ageRangeLabel(x)} · ${x.readMin} ${LANG === "en" ? "min read" : "min de lecture"} · ${trStr(x.kind)}</p>
    <div class="row between">${isDl(x.id) ? `<span class="badge ok">${ic("check")}Téléchargé</span>` : `<span class="badge mute">${off ? "Non téléchargé" : "En ligne"}</span>`}<button class="btn sm ${off ? "secondary" : ""}" data-go="content" data-p="${P({ id: x.id })}">Lire</button></div></article>`; }).join("")}
  <button class="btn soft" data-go="offline">${ic("download")}Mes ressources hors connexion</button></div></div>`;
}

const AI = { fn: null, url: "", state: "loading", busy: false, ctl: null, pending: null };
async function askEndpoint(payload, signal) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 35000);
  signal.addEventListener("abort", () => ctl.abort());
  try {
    const r = await fetch(AI.url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctl.signal });
    if (r.status === 429) throw { code: "rate_limited" };
    if (!r.ok) throw { code: "upstream_error" };
    const j = await r.json(); if (!j || !j.text) throw { code: "empty_completion" };
    return { text: j.text };
  } catch (e) { if (e && e.code) throw e; throw { code: signal.aborted ? "cancelled" : "upstream_error" }; }
  finally { clearTimeout(t); }
}

  "ai-yes"() { S.settings.aiOk = true; save(); closeSheet(); const p = AI.pending; AI.pending = null; if (p) answerQuestion(p.q, p.share); else render(true); },
  "ai-no"() { S.settings.aiOk = false; save(); closeSheet(); const p = AI.pending; AI.pending = null; if (p) answerQuestion(p.q, p.share); else render(true); },
  "ask-go-creche"() { UI.svcCat = "creche"; go("services", {}, { reset: true }); },
  "call-urgence"() { openSheet(`<h2>Appeler les urgences</h2><div class="notice coral">${ic("alert")}<span>Ces numéros viennent de sites et d'annuaires, pour la plupart non officiels : à vérifier avant le déploiement. En cas d'urgence, appelez le premier numéro qui répond.</span></div>${EMERGENCY.map(emergRow).join("")}<button class="btn secondary" data-act="close-sheet">Fermer</button>`); },
  "nut-age"(el) { UI.nutAge = el.dataset.id; render(true); },
  "nut-tips"() { UI.tipCat = "Nutrition"; go("tips"); },
  "go-ong"() { UI.svcCat = "ong"; go("services", {}, { reset: true }); },
  "find-pro"() { UI.svcCat = "pediatre"; mark("find"); go("services", {}, { reset: true }); },
  "measure-another"() { UI.justSaved = null; render(); },
  "ask-reset"() { confirmSheet("Réinitialiser le prototype ?", "Tous les comptes, enfants et données de cette démonstration seront effacés de ce navigateur.", "Réinitialiser", "do-reset"); },
  "do-reset"() { try { localStorage.removeItem(KEY); } catch (e) { } S = fresh(); UI.suiviTab = "growth"; UI.actAge = null; UI.justSaved = null; Net.timers.forEach(clearTimeout); Net.online = true; Net.phase = "online"; document.documentElement.classList.remove("big"); closeSheet(); nav.stack = [{ name: "welcome", params: {}, tab: null }]; render(); renderSide(); toast("Prototype réinitialisé."); },
  "demo-go"(el) {
    const k = el.dataset.k, authed = !!Repo.me();
    if (k === "offline") return setOnline(false); if (k === "online") return setOnline(true);
    if (k === "account") return go("register", {}, { reset: true });
    if (!authed) return toast("Chargez d'abord le profil de démonstration, ou créez un compte.");
    if (k === "find") { UI.svcCat = "pharmacie"; return go("services", {}, { reset: true }); }
    const to = { child: ["add-child"], flags: ["add-child"], dash: ["home"], suivi: ["suivi"], measure: ["measure"], tip: ["content", { id: "t1" }], resource: ["content", { id: "r2" }], offres: ["content", { id: "r2" }], services: ["services"], privacy: ["mydata"] }[k];
    if (to) { if (k === "offres" && Net.online) toast("Passez d'abord hors connexion, puis ouvrez la ressource."); go(to[0], to[1] || {}, ["home", "suivi", "services"].includes(to[0]) ? { reset: true } : {}); }
  },
};

/* =====================================================================
   ÉVÉNEMENTS GLOBAUX
   ===================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-go]"); if (!el) return;
  if (!el.closest("#phone") && !el.closest("#side")) return;
  if (el.dataset.go) { let p = {}; try { p = el.dataset.p ? JSON.parse(el.dataset.p) : {}; } catch (x) { } go(el.dataset.go, p); return; }
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("submit", e => { const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); F[f.dataset.form] && F[f.dataset.form](f); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "rg-pw") { const v = t.value, ok = { len: v.length >= 8, let: /[A-Za-z]/.test(v), num: /\d/.test(v) }; $$("#pwreq li").forEach(li => li.classList.toggle("ok", !!ok[li.dataset.r])); } const fld = t.closest && t.closest(".field"); if (fld) fld.classList.remove("invalid");
  if (t.dataset && t.dataset.live === "svc-city") { UI.svcCity = t.value; $("#svc-list").innerHTML = trHTML(svcSections()); }
  if (t.dataset && t.dataset.live === "svc-q") { UI.svcQ = t.value; $("#svc-list").innerHTML = trHTML(svcSections()); }
});
document.addEventListener("change", e => { const f = e.target.closest && e.target.closest("form[data-form='child']"); if (f) careHint(f); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.sheet) closeSheet(); });
/* ---------- Réseau réel de l'appareil ---------- */
window.addEventListener("offline", () => setOnline(false));
window.addEventListener("online", () => setOnline(true));

/* ---------- PWA : installation + service worker (actif seulement dans pwa/index.html) ---------- */
const PWAx = { deferred: null };
const refreshInstallUI = () => { if (["welcome", "profile"].includes(cur().name)) render(true); };
A["install-app"] = async () => {
  if (PWAx.deferred) {
    const d = PWAx.deferred; PWAx.deferred = null;
    try { d.prompt(); const r = await d.userChoice; if (r.outcome === "accepted") toast("Installation en cours…"); } catch (e) { }
    return refreshInstallUI();
  }
  if (isIOS()) return openSheet(`<h2>Installer sur iPhone ou iPad</h2><ol class="steps"><li><span class="num">1</span><span>Ouvrez cette page dans <b>Safari</b>.</span></li><li><span class="num">2</span><span>Touchez le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</span></li><li><span class="num">3</span><span>Choisissez <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</span></li></ol><button class="btn secondary" data-act="close-sheet">Fermer</button>`);
  openSheet(`<h2>Installer l'application</h2><ol class="steps"><li><span class="num">1</span><span><b>Android (Chrome)</b> : ouvrez le menu ⋮ puis touchez <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>.</span></li><li><span class="num">2</span><span><b>Ordinateur (Chrome, Edge)</b> : cliquez sur l'icône d'installation à droite de la barre d'adresse.</span></li></ol><p class="muted small">Si ces options n'apparaissent pas, l'application est peut-être déjà installée.</p><button class="btn secondary" data-act="close-sheet">Fermer</button>`);
};
if (PWA) {
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); PWAx.deferred = e; refreshInstallUI(); });
  window.addEventListener("appinstalled", () => { PWAx.deferred = null; toast("PETIT PAS est installé sur votre appareil."); refreshInstallUI(); });
  if ("serviceWorker" in navigator) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("Nouvelle version installée. Fermez puis rouvrez l'application pour l'utiliser.", 7000); });
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => { if (!had) toast("PETIT PAS est prêt pour une utilisation hors connexion.", 4500); }).catch(() => { }));
  }
}

/* ---------- Démarrage ---------- */
document.documentElement.classList.toggle("big", !!S.settings.big);
renderSide(); render();
if (navigator.onLine === false) setOnline(false);
window.addEventListener("load", () => { if (navigator.onLine === false && Net.online) setOnline(false); });
</script>
