/* Layout concept: un téléphone chaleureux au centre (app plein écran sur mobile),
   un panneau de démonstration sur grand écran. Teal = confiance, ocre = chaleur, corail = attention. */
:root{
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#FBF7EC; --page:#EFE8D3; --surface:#FFFFFF; --surface-2:#F5EEDC;
  --ink:#17302D; --ink-2:#4A615D; --ink-3:#5E746F;
  --line:#E6DDC6;
  --primary:#0B5748; --primary-strong:#074B40; --on-primary:#FFFFFF; --primary-soft:#DDEFE6;
  --ochre:#F5A30A; --ochre-soft:#FDEBC3; --ochre-ink:#6F4A00; --ref2:#C77700;
  --coral:#E85B04; --coral-soft:#FDE3D0; --coral-ink:#9C3A00;
  --danger:#B3261E; --on-danger:#FFFFFF;
  --series:#0B5748; --series-2:#C24E00;
  --hero-a:#0B5748; --hero-b:#074B40; --on-hero:#FFF6E3;
  --shadow:0 1px 2px rgba(23,48,45,.06),0 8px 20px rgba(23,48,45,.07);
  --frame:#17302D; --overlay:rgba(10,30,28,.52);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C1B; --page:#091312; --surface:#172826; --surface-2:#1E322F;
    --ink:#EAF4F1; --ink-2:#B1C7C2; --ink-3:#93ABA6; --line:#2B403D;
    --primary:#4CBFA2; --primary-strong:#92DDC6; --on-primary:#05231B; --primary-soft:#153E35;
    --ochre:#F7B63A; --ochre-soft:#3B2E10; --ochre-ink:#F6D98F; --ref2:#F7B63A;
    --coral:#F58A4B; --coral-soft:#432816; --coral-ink:#FFC49A;
    --danger:#D2503A; --on-danger:#FFFFFF;
    --series:#4CBFA2; --series-2:#F58A4B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
    --frame:#233735; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C1B; --page:#091312; --surface:#172826; --surface-2:#1E322F;
  --ink:#EAF4F1; --ink-2:#B1C7C2; --ink-3:#93ABA6; --line:#2B403D;
  --primary:#4CBFA2; --primary-strong:#92DDC6; --on-primary:#05231B; --primary-soft:#153E35;
  --ochre:#F7B63A; --ochre-soft:#3B2E10; --ochre-ink:#F6D98F; --ref2:#F7B63A;
  --coral:#F58A4B; --coral-soft:#432816; --coral-ink:#FFC49A;
  --danger:#D2503A; --on-danger:#FFFFFF;
  --series:#4CBFA2; --series-2:#F58A4B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  --frame:#233735; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:16px}
html.big{font-size:18.5px}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:1.7rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.35rem;height:1.35rem;flex:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Stage & phone ---------- */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch}
.side{display:none}
.phone{position:relative;flex:0 1 430px;min-width:0;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.noanim .page{animation:none!important}
.page{display:flex;flex-direction:column;gap:20px;padding-bottom:28px;animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:960px){
  .stage{gap:44px;padding:20px 28px;align-items:center}
  .side{display:block;flex:0 0 370px;max-height:100%;overflow:auto;padding:6px 4px 6px 0}
  .phone{height:min(100%,880px);border:9px solid var(--frame);border-radius:44px;box-shadow:0 34px 60px -24px rgba(10,40,38,.5)}
}

/* ---------- Top bars ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:4px;min-height:60px}
.topbar h1{font-size:1.35rem;flex:1;min-width:0}
.topbar .grow{flex:1;min-width:0}
.iconbtn{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid var(--surface)}
.netchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:999px;border:0;background:var(--primary-soft);color:var(--primary-strong);font-weight:800;font-size:.82rem;white-space:nowrap}
.netchip i{width:9px;height:9px;border-radius:50%;background:#2FA36B;display:inline-block}
.netchip.off{background:var(--ochre-soft);color:var(--ochre-ink)}
.netchip.off i{background:var(--ochre)}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow b{font-family:var(--font-display);font-size:1.15rem;letter-spacing:.04em}

/* ---------- Net banner ---------- */
.netbar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-weight:800;font-size:.92rem;line-height:1.3}
.netbar[hidden]{display:none}
.netbar.off{background:var(--ochre-soft);color:var(--ochre-ink)}
.netbar.back,.netbar.sync,.netbar.done{background:var(--primary-soft);color:var(--primary-strong)}
.netbar small{display:block;font-weight:600;font-size:.8rem;opacity:.9}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Tab bar ---------- */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px))}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:0;background:none;color:var(--ink-2);font-size:.78rem;font-weight:700;min-height:56px}
.tab .tab-ico{display:grid;place-items:center;width:54px;height:30px;border-radius:15px;transition:background .2s}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary-strong)}
.tab[aria-current="page"] .tab-ico{background:var(--primary-soft)}
.tab[aria-current="page"] span:last-child{font-weight:800}

/* ---------- Langue FR | EN, aide mot de passe, en-tête accueil ---------- */
.lang{display:inline-flex;flex:none;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1.5px var(--line)}
.lang button{min-width:36px;height:38px;padding:0 4px;border:0;border-radius:999px;background:none;font-weight:800;font-size:.8rem;letter-spacing:.03em;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chat{display:flex;flex-direction:column;gap:10px}
.chat:empty{display:none}
.bubble{max-width:94%;padding:12px 14px;border-radius:18px;font-size:.98rem;line-height:1.5;overflow-wrap:anywhere}
.bubble p+p{margin-top:6px}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.bubble.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bubble.bot ul{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.bubble.bot li{display:flex;gap:8px}
.bubble.bot li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ochre);margin-top:.6em}
.bubble .urgent{display:flex;gap:8px;align-items:flex-start;background:var(--coral-soft);color:var(--coral-ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:800}
.bubble .links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bubble .links .btn{width:100%;justify-content:flex-start;text-align:left}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg .chip{white-space:normal;text-align:left;line-height:1.25;padding-top:8px;padding-bottom:8px}
.svc-cats .chip:last-child:nth-child(odd){grid-column:1/-1}
.welcome-lang{position:absolute;top:12px;right:max(14px,env(safe-area-inset-right,0px));z-index:2}
.home-head{display:flex;flex-direction:column;gap:4px;padding-top:12px;padding-bottom:2px}
.brandline{display:flex;align-items:center;gap:8px;margin:0;font-weight:800;font-size:.9rem;color:var(--ink-2);letter-spacing:.03em}
.pwreq{display:flex;flex-direction:column;gap:7px;font-size:.88rem;color:var(--ink-2)}
.pwreq ul{display:flex;flex-wrap:wrap;gap:6px}
.pwreq li{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);font-weight:700;transition:background .15s}
.pwreq li::before{content:"○";font-size:.85em}
.pwreq li.ok{background:var(--primary-soft);color:var(--primary-strong)}
.pwreq li.ok::before{content:"✓"}
@media (max-width:380px){.netchip{padding:0 10px;font-size:.76rem}.lang button{min-width:32px}}

/* ---------- Cards & basics ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.93rem}
.tiny{font-size:.86rem;color:var(--ink-2)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title h2{font-size:1.15rem}
.linkbtn{border:0;background:none;color:var(--primary-strong);font-weight:800;padding:8px 2px;text-decoration:underline;text-underline-offset:3px;font-size:.95rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.82rem;font-weight:800;line-height:1.2;white-space:nowrap}
.badge.care{background:var(--coral-soft);color:var(--coral-ink)}
.badge.ok{background:var(--primary-soft);color:var(--primary-strong)}
.badge.warn{background:var(--ochre-soft);color:var(--ochre-ink)}
.badge.mute{background:var(--surface-2);color:var(--ink-2)}
.badge .ic{width:14px;height:14px}
.notice{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--ochre-soft);color:var(--ochre-ink);font-size:.95rem;line-height:1.45}
.notice .ic{margin-top:1px}
.notice.coral{background:var(--coral-soft);color:var(--coral-ink)}
.notice.teal{background:var(--primary-soft);color:var(--primary-strong)}
.demo-tag{font-size:.86rem;font-weight:800;color:var(--ochre-ink);background:var(--ochre-soft);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;padding:0 20px;border-radius:17px;border:2px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:1.02rem;text-align:center;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface);color:var(--primary-strong);border-color:var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary-strong)}
.btn.sun{background:var(--ochre);color:#2B1D00}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.ghost{background:transparent;color:var(--primary-strong)}
.btn.sm{min-height:46px;width:auto;padding:0 16px;font-size:.92rem;border-radius:14px}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ---------- Forms ---------- */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.field>.lbl{font-weight:800;font-size:.95rem}
.field .opt{font-weight:600;color:var(--ink-2)}
.hint{font-size:.9rem;color:var(--ink-2)}
.input{width:100%;min-height:54px;padding:0 15px;border-radius:15px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.input{padding:13px 15px;min-height:104px;resize:vertical;line-height:1.4}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.err{display:none;color:var(--coral-ink);font-size:.92rem;font-weight:800}
.field.invalid .input{border-color:var(--danger)}
.field.invalid .err{display:block}
.pwwrap{position:relative}
.pwwrap .input{padding-right:54px}
.pwwrap .eye{position:absolute;right:4px;top:5px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--ink-2);border-radius:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;flex:1 1 auto}
.pill input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pill span{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 16px;border-radius:15px;border:2px solid var(--line);background:var(--surface);font-weight:800;text-align:center}
.pill input:checked+span{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill input:focus-visible+span{outline:3px solid var(--ochre);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.95rem}
.check input{appearance:none;flex:none;width:28px;height:28px;margin:0;border-radius:9px;border:2px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{content:"";width:7px;height:13px;border:solid var(--on-primary);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.invalid input{border-color:var(--danger)}
.check .linkbtn{padding:0;font-size:inherit}
.switch{position:relative;flex:none;width:54px;height:32px;border-radius:999px;border:0;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* ---------- Chips / segmented ---------- */
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.9rem;color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip .n{font-size:.8rem;opacity:.85}

/* ---------- Splash / Welcome ---------- */
.splash{height:100%;min-height:100%;background:#FFFCF3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:0 24px;cursor:pointer}
.splash-logo{width:100%;max-width:380px;animation:rise .7s .1s ease-out both}
.logo-full{display:block;width:100%;height:auto}
.dots{display:flex;gap:8px;animation:rise .5s .8s both}
.dots i{width:9px;height:9px;border-radius:50%;background:#0B5748;opacity:.3;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.welcome-hero{position:relative;background:#FFFCF3;border-radius:0 0 40px 40px;padding:60px 28px 26px;display:flex;justify-content:center;box-shadow:0 12px 26px -16px rgba(7,75,64,.4)}
.welcome-hero .logo-full{max-width:340px}
.logo-card{background:#FFFCF3;border:1px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;justify-content:center}
.logo-card .logo-full{max-width:320px}
.bm{display:inline-grid;place-items:center;flex:none;background:#fff;border-radius:30%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(7,75,64,.14)}
.bm img{width:90%;height:90%;object-fit:contain}
.welcome-body{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.welcome-body .links{display:flex;flex-direction:column;align-items:center;gap:0}
.note{display:block;font-size:.9rem;color:var(--ink-2);text-align:center}
.note .ic{display:inline-block;vertical-align:-4px;margin-right:7px}

/* ---------- Dashboard ---------- */
.child-card{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;border:0;background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--on-hero);box-shadow:var(--shadow)}
.avatar{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:rgba(255,246,227,.16);font-size:1.9rem}
.cc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cc-name{font-family:var(--font-display);font-size:1.4rem;font-weight:700;line-height:1.1}
.cc-age{font-size:1rem;opacity:.95}
.child-card .badge.care{background:#FDE3D0;color:#8A3200;align-self:flex-start;margin-top:4px}
.tip{background:var(--ochre-soft);color:var(--ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tip .kicker{font-weight:800;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ochre-ink)}
.tip p{font-size:1.02rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-height:132px;min-width:0}
.tile .em{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;font-size:1.4rem;background:var(--surface-2)}
.tile .t{font-family:var(--font-display);font-weight:700;font-size:1.08rem;line-height:1.1}
.tile .s{font-size:.92rem;color:var(--ink-2);line-height:1.3}
.tile.a .em{background:var(--primary-soft)}.tile.b .em{background:var(--ochre-soft)}.tile.c .em{background:var(--coral-soft)}.tile.d .em{background:var(--surface-2)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-radius:17px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.92rem;text-align:left;line-height:1.2}
.quick .ic{color:var(--primary-strong);width:1.5rem;height:1.5rem}
.care-banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--coral-soft);color:var(--coral-ink);border:0;text-align:left;width:100%}
.care-banner b{display:block;font-family:var(--font-display);font-size:1.05rem;color:var(--ink)}
.care-banner span.s{font-size:.86rem;color:var(--ink-2);line-height:1.3}
.rem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ri{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary-strong)}
.rem.k-measure .ri{background:var(--ochre-soft);color:var(--ochre-ink)}
.rem.k-resource .ri{background:var(--coral-soft);color:var(--coral-ink)}
.rem .rt{flex:1;min-width:0}
.rem b{display:block;font-size:.95rem}
.rem .x{flex:none;border:0;background:none;color:var(--ink-2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}

/* ---------- Lists ---------- */
.li{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li b{display:block}
.menu{padding:4px 16px}
.menu .li{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;min-height:58px}
.menu .li:last-child{border-bottom:0}
.menu .li .ic.lead{color:var(--primary-strong)}
.menu .li .ic.end{color:var(--ink-3);width:1.1rem}
.cardlink{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.cardlink h3,.card h3{font-size:1.1rem}

/* ---------- Chart ---------- */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:10.5px;fill:var(--ink-2);font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink-3);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .vlab{font-size:12px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tick{stroke:var(--ink-3);stroke-width:1}
.chart .z3{fill:var(--danger);fill-opacity:.11}.chart .z2{fill:var(--ochre);fill-opacity:.22}.chart .z0{fill:var(--primary);fill-opacity:.06}
.chart .rm,.chart .r2,.chart .r3{fill:none;stroke-width:1.7;stroke-linejoin:round}
.chart .rm{stroke:var(--ink-3)}.chart .r2{stroke:var(--ref2);stroke-dasharray:5 3}.chart .r3{stroke:var(--danger);stroke-dasharray:5 3}
.chart .rl{font-size:10px;font-weight:800;font-family:var(--font-body)}.chart .rlm{fill:var(--ink-3)}.chart .rl2{fill:var(--ref2)}.chart .rl3{fill:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--ink-2)}
.legend .sw{display:inline-block;width:22px;height:0;border-top:3px solid;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend .md{border-top:2px solid var(--ink-3)}.legend .l2{border-top:2px dashed var(--ref2)}.legend .l3{border-top:2px dashed var(--danger)}
details.howto{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface-2)}
details.howto summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;list-style-position:inside}
details.howto[open] summary{margin-bottom:4px}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.readout .big{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist th{font-size:.78rem;text-align:left;color:var(--ink-2);padding:6px 6px 6px 0;font-weight:800}
.hist td{padding:10px 6px 10px 0;border-top:1px solid var(--line);font-size:.95rem;vertical-align:top}
.hist td.r,.hist th.r{text-align:right;padding-right:0}

/* ---------- Detail content ---------- */
.article h2{margin-top:6px;font-size:1.15rem}
.article p,.article li{font-size:1.02rem;line-height:1.55}
.article ul{display:flex;flex-direction:column;gap:8px;padding-left:2px}
.article li{display:flex;gap:10px}
.article li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ochre);margin-top:.6em}
.article>*+*{margin-top:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.steps .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:.9rem}

/* ---------- Sheet / toast ---------- */
.overlay{position:absolute;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) 26px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:slide .26s ease-out both}
@keyframes slide{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet:focus{outline:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-top:-10px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:50;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:16px;font-weight:700;font-size:.93rem;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:rise .25s both}
.toast[hidden]{display:none}

/* ---------- Illustration & misc ---------- */
.hero-sm{display:flex;flex-direction:column;gap:6px}
.progress{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s}
.stepcard{display:flex;gap:14px;align-items:flex-start}
.stepcard .sn{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-strong);font-size:1.4rem}
.vgroup h3{margin:4px 0 2px;font-size:.95rem;color:var(--ink-2);font-family:var(--font-body);font-weight:800}
.mini-check{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.mini-check:last-child{border-bottom:0}
.mini-check .box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent}

   à variables (EN.pat) et contenus longs remplacés sur place (EN.contents, ...).

   ===================================================================== */
const EN = { dict: {}, pat: [], contents: {}, activities: {}, services: {}, milestones: [], vaccines: {}, nutri: {} };
const MISS = new Set();
const dec = s => s.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
const encT = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const encA = s => encT(s).replace(/"/g, "&quot;");
function trLookup(s) {
  const d = EN.dict[s]; if (d !== undefined) return d;
  for (const [re, rep] of EN.pat) if (re.test(s)) return s.replace(re, rep);
  return null;
}
function trStr(s) {                                   /* texte brut (toasts, textContent, aria-label posé en JS) */
  if (LANG !== "en" || !s) return s;
  const r = trLookup(s); if (r !== null) return r;
  if (/[A-Za-zÀ-ÿ]{2,}/.test(s)) MISS.add(s);
  return s;
}
function trHTML(html) {                               /* HTML produit par les écrans : textes et attributs aria-label / placeholder / title / alt */
  if (LANG !== "en") return html;
  html = html.replace(/\b(aria-label|placeholder|title|alt)="([^"]*)"/g, (m, a, v) => { const raw = dec(v), r = trLookup(raw); if (r === null) { if (/[A-Za-zÀ-ÿ]{2,}/.test(raw)) MISS.add(raw); return m; } return `${a}="${encA(r)}"`; });
  html = html.replace(/<option value="([^"]*)">/g, (m, v) => { const r = trLookup(dec(v)); return r === null ? m : `<option value="${encA(r)}">`; });
  return html.replace(/>([^<>]+)</g, (m, txt) => {
    const core = txt.trim(); if (!core) return m;
    const raw = dec(core), r = trLookup(raw);
    if (r === null) { if (/[A-Za-zÀ-ÿ]{2,}/.test(raw)) MISS.add(raw); return m; }
    const lead = txt.slice(0, txt.indexOf(core));
    return ">" + lead + encT(r) + txt.slice(lead.length + core.length) + "<";
  });
}

function applyLangData() {
  const en = LANG === "en";
  CONTENTS.forEach(c => Object.assign(c, en && EN.contents[c.id] ? EN.contents[c.id] : FR0.c[c.id]));
  ACTIVITIES.forEach(a => Object.assign(a, en && EN.activities[a.id] ? EN.activities[a.id] : FR0.a[a.id]));

Object.assign(EN.contents, {
  t1: { title: "Talk, sing and answer your baby", summary: "Talk, sing and respond to your baby's sounds. These simple interactions support their early learning and communication.",
    body: [["p", "From birth, your baby listens to your voice and recognises it. When they coo, answer as in a real conversation: wait, look at them, then speak in your turn."], ["h", "How to do it every day"], ["ul", ["Talk to them during the bath, meals and when carrying them.", "Sing lullabies or songs from your own childhood.", "Copy their sounds and smiles, then give them time to answer.", "Say what you are doing: \"Mummy is washing your hands\"."]], ["p", "These small exchanges, repeated every day, support language, confidence and the bond with you."]] },
  t2: { title: "Handwashing, a simple gesture that protects", summary: "Washing hands with soap and water before preparing a meal or touching your baby helps protect them from germs.",
    body: [["p", "Hands are the first route for germs. Washing for 20 seconds with clean water and soap is enough."], ["h", "When to wash your hands"], ["ul", ["Before touching your baby, especially if they are very small.", "Before preparing or serving a meal.", "After using the toilet and after changing a nappy.", "After coming back from the market or from outside."]], ["p", "Show the gesture to your child as soon as they can stand: they will learn it by copying you."]] },
  t3: { title: "Breastfeed on demand", summary: "Breast milk alone is enough for the first 6 months.",
    body: [["p", "The general recommendations are to breastfeed your baby from birth and to give only breast milk for the first 6 months, with no water or other food."], ["h", "A few pointers"], ["ul", ["Offer the breast as soon as your baby shows they are hungry: they search, open their mouth, bring a hand to their mouth.", "Feeds are frequent, day and night.", "A good position (baby facing you, mouth wide open) prevents pain."]], ["p", "If breastfeeding is difficult, a midwife or a health worker can help you. You do not have to face a difficulty alone."]] },
  t4: { title: "First foods at around 6 months", summary: "From 6 months, add a variety of foods while continuing to breastfeed.",
    body: [["p", "Around 6 months, breast milk alone is no longer enough. You start offering foods in addition, while continuing to breastfeed."], ["h", "How to start"], ["ul", ["Thick, enriched porridges (well-cooked local cereals, groundnut, soya).", "Vegetable and fruit purées: sweet potato, pumpkin, banana, papaya.", "One new food at a time, in a small amount, then more.", "Well-cooked and mashed egg, fish or meat as soon as possible."]], ["p", "Wash your hands, use clean water and a clean spoon. Never force your child: try again the next day."]] },
  t5: { title: "Sleep on the back, in a clear cot", summary: "For sleep, lay your baby on their back on a firm mattress, under a mosquito net.",
    body: [["p", "Safe sleep helps your baby rest well and lowers risks."], ["ul", ["Lay them on their back, on a firm mattress.", "No pillow, soft toy or thick blanket near their face.", "Use an insecticide-treated mosquito net.", "Do not let anyone smoke near them."]], ["p", "It is normal for a baby to wake several times a night. This changes with age."]] },
  t6: { title: "A small bedtime routine", summary: "Calm gestures, always in the same order, help your child fall asleep.",
    body: [["p", "Children like to know what comes next. A short routine reassures them."], ["ul", ["A warm bath or a gentle wash.", "A lullaby or a short story.", "Dim light and a quiet place.", "The same place to sleep every evening."]], ["p", "Be patient: it often takes a few weeks for a routine to settle."]] },
  t7: { title: "Play with everyday objects", summary: "Clean cups, boxes and cloths make excellent play-and-learn toys.",
    body: [["p", "No need for expensive toys: clean, safe household objects are enough."], ["ul", ["Cups to stack or fill.", "A box with a lid to open and close.", "A colourful cloth to play peekaboo."]], ["p", "Always stay close and remove any object small enough to be swallowed."]] },
  t8: { title: "Read and tell stories, even to little ones", summary: "Telling a story or looking at a book together feeds language.",
    body: [["p", "You do not need a book: tell a folk tale, a family story or what happened during the day."], ["p", "Ask simple questions: \"What do you see?\", \"And then?\". Let your child answer, even with a few words."]] },
  t9: { title: "Praise rather than scold", summary: "Encouraging good behaviour helps your child repeat it.",
    body: [["p", "A child learns best when they feel safe. A kind word, a smile or a cuddle when they succeed encourages them more lastingly than a punishment."], ["ul", ["Say exactly what was good: \"You put your plate away, thank you!\"", "Explain calmly what you expect.", "Take a breath before answering when you are tired or angry."]]] },
  t10: { title: "Set limits with kindness", summary: "Simple, steady, explained rules reassure your child.",
    body: [["p", "At 2-3 years old, your child tests limits: that is normal. Choose a few important rules (safety, respect) and stick to them calmly."], ["p", "Offer choices when you can: \"Would you like the red trousers or the blue ones?\""]] },
  t11: { title: "Look after yourself to look after them", summary: "Resting, eating and asking for help are also part of your role as a parent.",
    body: [["p", "The first months are tiring. Rest when your baby sleeps, eat enough, and accept help from those close to you."], ["p", "If you feel very sad, exhausted or overwhelmed for several days, talk to a health professional or to someone you trust."]] },
  t12: { title: "Preparing follow-up appointments", summary: "Write down your questions and bring the health record book and the latest measurements.",
    body: [["p", "A baby born prematurely often has closer check-ups. A few habits make them more useful."], ["ul", ["Bring the health record book and the measurements noted in PETIT PAS.", "Write your questions down before you go.", "Note what you have observed since the last visit.", "Ask when the next appointment will be."]], ["p", "These tips are general. Always follow the instructions of the team following your child."]] },
  t13: { title: "Breastfeeding a small baby", summary: "A small baby tires quickly: frequent feeds, patience and support from a professional.",
    body: [["p", "A baby born with a low birth weight may feed for less time or fall asleep at the breast. Frequent feeds and skin-to-skin contact often help."], ["ul", ["Offer the breast often, including at night.", "Keep them close to you before and during the feed.", "Ask a midwife or health worker to check the position."]], ["p", "Tell your health professional about your worries: they will adapt the advice to your baby."]] },
  t14: { title: "Keeping baby warm", summary: "Small babies lose heat quickly: a hat, suitable clothes, skin-to-skin contact.",
    body: [["p", "A small baby finds it harder to stay warm. Cover their head with a hat, avoid draughts and favour skin-to-skin contact."], ["p", "They should be neither too wrapped up nor left cold: feel the back of their neck or their back to check."]] },
  t15: { title: "Regular weighing: why note it down", summary: "Noting each weighing helps the health professional follow your child's progress.",
    body: [["p", "Weighing your child at the rhythm recommended by your health professional, ideally on the same scale, gives reliable reference points."], ["ul", ["Note the date, weight and height in PETIT PAS.", "Show the history at consultations.", "Do not compare your child with another: every child is different."]], ["p", "PETIT PAS shows your measurements but never says whether they are normal or not. Only a professional can interpret them."]] },
  t16: { title: "First steps: every child at their own pace", summary: "Standing up, walking: ages vary a lot from one child to another.",
    body: [["p", "Some children walk at 10 months, others at 16 months. Encourage them without rushing: let them crawl, pull themselves up and walk around the furniture."], ["p", "If you have a doubt about their development, note it in the Observations tab and talk to a health professional."]] },
  t17: { title: "Keeping drinking water clean", summary: "Storing water in a clean, covered container protects the whole family.",
    body: [["p", "Use water from a safe source. Store it in a clean, covered container and use a clean cup to take it."], ["p", "Keep your baby's utensils clean and let them air-dry away from flies."]] },
  r1: { title: "Understanding my child's development", summary: "The main areas of development and how to support your child every day.",
    body: [["p", "Every child grows at their own pace. Development covers several areas that move forward together: movement (motor skills), language, emotions and relationships, and discovering the world."], ["h", "What you may notice"], ["ul", ["First months: your baby looks at faces, reacts to voices, smiles.", "Around 6 to 12 months: they grasp objects, sit, babble and start to move around.", "Between 1 and 3 years: they walk, say their first words and want to do things alone.", "Between 3 and 6 years: they play with others, tell stories, draw and learn rules."]], ["h", "How to support them"], ["p", "Talk to them, sing and play with them every day. Everyday moments (bath, meals, carrying) are already chances to learn."], ["h", "When to talk to a professional"], ["p", "If a question worries you, note it in the Observations tab and talk to a health worker at your next visit. PETIT PAS does not make diagnoses."]] },
  r2: { title: "Supporting my premature baby", summary: "General pointers for home follow-up of a baby born early or with a low birth weight.",
    body: [["p", "A baby born before term (before 37 weeks of pregnancy) or with a low birth weight often needs closer follow-up. This article gives general pointers to support them at home. It does not replace the instructions of the health team following your child."], ["h", "Skin-to-skin contact"], ["p", "Holding your baby against your skin, dressed in just a nappy and a hat, keeps them warm, calms their crying and helps breastfeeding. Dad or another relative can do it too."], ["h", "Feeding and weighing"], ["p", "Breast milk is the recommended food. Regular weighing, following the schedule given by your health professional, lets you track progress. Note each measurement in PETIT PAS to show it at consultations."], ["h", "Corrected age"], ["p", "To follow the progress of a premature baby, professionals often use \"corrected age\": the real age minus the number of weeks of prematurity. A baby aged 8 months born 7 weeks early therefore has a corrected age of about 6 months."], ["h", "Protective gestures"], ["ul", ["Wash your hands before touching them.", "Limit visitors and avoid people who are ill.", "Keep the baby away from smoke.", "Follow the vaccination schedule."]], ["h", "When to seek care"], ["p", "Ask a health professional for advice if your baby refuses to feed, seems very sleepy, has difficulty breathing or if anything worries you. In a serious or urgent situation, go to a health facility without delay."]] },
  r3: { title: "Play activities at home", summary: "Simple play ideas, with no costly equipment, for every age.",
    body: [["p", "Play is how your child learns. Here are simple ideas to adapt to their age."], ["h", "0 to 6 months"], ["p", "Looks, smiles, a soft voice, massages, a colourful cloth to follow with the eyes."], ["h", "6 to 12 months"], ["p", "Songs, peekaboo with a wrap cloth, boxes to open and close, objects to grasp."], ["h", "1 to 2 years"], ["p", "Stacking cups, naming what you see, dancing and copying animals."], ["h", "2 to 6 years"], ["p", "Role play (market, cooking), drawing, counting, stories, games with rules such as awalé."], ["p", "Find the details of each activity in the Activities tab."]] },
  r4: { title: "Hygiene tips", summary: "Simple hygiene habits that protect your child every day.",
    body: [["p", "Hygiene protects your child from many common illnesses. The gestures are simple and cheap."], ["h", "The essential gestures"], ["ul", ["Wash hands with soap and water.", "Use clean water for drinking and preparing meals.", "Wash utensils and cover them.", "Keep nails short and clean.", "Sleep under an insecticide-treated mosquito net."]], ["h", "Bathing and care"], ["p", "A warm bath every day, careful drying of skin folds and regular nappy changes prevent irritation."], ["p", "For any skin or health problem that worries you, ask a health professional for advice."]] },
  r5: { title: "Feeding young children", summary: "From breastfeeding to family meals: a general guide to feeding your child well.",
    body: [["h", "0 to 6 months"], ["p", "Breast milk only, on demand, with no water or other food."], ["h", "6 to 12 months"], ["p", "Keep breastfeeding and add enriched porridges, vegetable and fruit purées, and iron-rich foods (well-cooked meat, fish, eggs, pulses)."], ["h", "12 to 24 months"], ["p", "Your child gradually eats the family's meals, in small pieces. Breastfeeding can continue up to 2 years and beyond."], ["h", "Good habits"], ["ul", ["3 meals and 1 to 2 snacks a day from 1 year.", "Vary colours and foods.", "No added sugar and not too much salt.", "Never force: offer again later."]], ["p", "For a child born prematurely or with a low birth weight, the health professional may give particular advice: follow it."]] },
  r6: { title: "Skin-to-skin at home (kangaroo care)", summary: "How to practise skin-to-skin contact with a small baby, safely.",
    body: [["p", "Skin-to-skin means placing the baby, in a nappy and hat, against the bare chest of one of their parents, covered with a wrap cloth or clothing."], ["ul", ["Sit comfortably, with your back supported.", "Baby is upright, head turned to the side, airways clear.", "Stay awake and attentive while baby is on you.", "Dad can practise it too."]], ["p", "Your health professional will tell you the most suitable duration for your baby."]] },
  r7: { title: "Baby sleep: pointers and tips", summary: "Understanding sleep needs and building good habits.",
    body: [["p", "Babies' sleep is very different from adults': several wake-ups are normal. Here are some general pointers."], ["ul", ["Always lay baby on their back.", "Keep the room quiet and dim at night.", "Set up a simple routine before naps and bedtime."]], ["p", "If you have any doubt about your child's sleep or breathing, ask a health professional for advice."]] },
  r8: { title: "Using the health record book well", summary: "The health record book keeps the history of vaccines, weighings and consultations.",
    body: [["p", "The health record book is the official document for your child's follow-up. Keep it somewhere safe and bring it to every consultation."], ["ul", ["Check that every vaccine and every weighing is noted in it.", "Take a photo of it to keep a copy.", "Complete your notes in PETIT PAS so you forget nothing."]]] },
});

Object.assign(EN.contents, {
  f1: { title: "A child who is choking", summary: "What to do straight away if a child swallows the wrong way and cannot cough, cry or breathe.",
    body: [["p", "Act fast and stay calm. If the child is coughing hard, talking or crying: let them cough, stay close and do not hit their back. The steps below are for a child who can no longer cough, cry or breathe (mouth open with no sound, face turning blue)."], ["h", "Baby under 1 year"], ["ul", ["Ask someone to call the emergency services, without moving away from the child.", "Lay the baby face down along your forearm, head lower than the body, supporting the jaw.", "Give 5 firm blows on the back, between the shoulder blades, with the heel of your hand.", "Turn them onto their back, head still lower than the body. With two fingers in the middle of the chest, just below the nipple line, give 5 sharp, quick presses.", "Alternate 5 back blows and 5 chest presses until the object comes out or the baby starts crying or breathing again."]], ["h", "Child over 1 year"], ["ul", ["Lean the child forward and give 5 firm blows on the back, between the shoulder blades.", "If the object does not come out, stand behind them. Place a closed fist above the navel, below the breastbone, the other hand over it, and pull hard towards you and upwards, 5 times.", "Alternate 5 back blows and 5 abdominal thrusts until the object comes out."]], ["h", "If the child stops responding"], ["p", "Lay them down and have someone call the emergency services. If you know how to do resuscitation, start. If not, follow the instructions given over the phone."], ["h", "What not to do"], ["ul", ["Do not put your fingers deep into their mouth blindly.", "Do not hold them upside down by the feet.", "Do not give water or food."]], ["h", "Afterwards"], ["p", "Even if the object has come out, have the child checked by a health professional, especially after abdominal thrusts."], ["h", "How to prevent it"], ["p", "Before age 4, avoid whole peanuts, hard sweets and small objects. Have the child eat sitting down, under supervision."]] },
  f2: { title: "Blocked nose", summary: "How to clear the nose of a baby or child with a cold, and when to seek care.",
    body: [["p", "A baby breathes mostly through the nose: a blocked nose can make feeding and sleeping hard."], ["h", "What to do"], ["ul", ["Wash your hands.", "Lay the baby on their back, head turned to the side, or hold them sitting up.", "Put 2 to 3 drops of saline solution (single-dose ampoule) in each nostril. If you have none, ask a pharmacist or a health worker.", "Gently wipe with a clean rolled cloth, or use a baby nasal aspirator without forcing.", "Do it before feeds and before sleep, 3 to 4 times a day at most.", "During the day, keep the baby a little upright in your arms and offer drinks or breastfeeds often. For sleep, always lay them flat on their back."]], ["h", "What not to do"], ["ul", ["Do not put cotton buds in the nose.", "Do not use adult drops or sprays, or menthol or camphor products, without a professional's advice.", "Do not force the cleaning if the child cries a lot or the nose bleeds."]], ["h", "Seek care quickly if"], ["ul", ["They breathe very fast, suck in the belly or ribs, or their nostrils flare.", "They refuse to feed or drink.", "They have a fever and are under 3 months old.", "The nose stays blocked for more than 10 days.", "They are very sleepy, groan or turn blue around the lips: this is an emergency."]]] },
  f3: { title: "Fever", summary: "What to do while waiting to see a health professional, and the signs that mean you should seek care quickly.",
    body: [["p", "A fever means 38 °C or more. In a child, a fever can be a sign of malaria: have them examined and tested quickly."], ["h", "What to do"], ["ul", ["Uncover the child: light clothes, airy room, no thick blanket.", "Give drinks often. Breastfeed a baby more often.", "Take their temperature and note the time and the value.", "For a fever medicine, ask a pharmacist or a health worker for the dose, based on age and weight. Never give an adult's medicine.", "Have the child sleep under an insecticide-treated mosquito net."]], ["h", "What not to do"], ["ul", ["No cold bath, no alcohol on the skin, and no product not advised by a professional.", "Do not give aspirin to a child.", "Do not force them to drink."]], ["h", "Seek care without delay if"], ["ul", ["The child is under 3 months old, even with a mild fever.", "The fever lasts more than 2 days or goes very high.", "They have convulsions, a stiff neck, a rash or spots on the skin.", "They are very sleepy, very irritable, no longer drink or have difficulty breathing.", "They vomit everything or have heavy diarrhoea."]]] },
  f4: { title: "Burn", summary: "Cool with water, protect, and know when to go to hospital.",
    body: [["h", "What to do straight away"], ["ul", ["Move the child away from the source of heat.", "Hold the burn under cool (not ice-cold) running water for 10 to 20 minutes.", "Remove clothing and jewellery that is not stuck to the skin.", "Cover loosely with a clean, non-fluffy cloth.", "Keep the child warm (but not the burnt area) and reassure them."]], ["h", "What not to do"], ["ul", ["Do not apply butter, oil, toothpaste, ash or any other product.", "Do not burst blisters.", "Do not remove clothing stuck to the skin."]], ["h", "Go to emergency if"], ["ul", ["The burn is bigger than the child's palm, or is on the face, hands, feet, genitals or a joint.", "It is a baby, or the burn is deep, white, black or has large blisters.", "It comes from a chemical (rinse for a long time with water), an electric current or smoke."]]] },
  f5: { title: "Nosebleed", summary: "Sit the child up, pinch the nose, and know when to seek care.",
    body: [["h", "What to do"], ["ul", ["Sit the child up, head leaning forward (not back).", "Pinch the soft part of the nose between thumb and finger for 10 minutes, without letting go.", "Ask them to breathe through the mouth. Put a cold cloth on the nose.", "Afterwards, stop them blowing or picking their nose for several hours."]], ["h", "Seek care if"], ["ul", ["The bleeding lasts more than 20 minutes despite these steps.", "It follows a hard blow to the head or face.", "The child is pale, very tired, or often has nosebleeds."]]] },
  f6: { title: "Convulsions", summary: "Stay calm, protect the child and time the seizure.",
    body: [["h", "During the seizure"], ["ul", ["Note the start time.", "Lay the child on their side, on a safe surface, and move hard objects away.", "Loosen their clothes and put something soft under their head.", "Stay close and watch their breathing."]], ["h", "What not to do"], ["ul", ["Do not put anything in their mouth: no finger, spoon or medicine.", "Do not hold them down by force.", "Do not pour water on them or shake them."]], ["h", "Call the emergency services or go to hospital if"], ["ul", ["The seizure lasts more than 5 minutes or repeats.", "It is the child's first seizure.", "They have trouble breathing or stay very sleepy after the seizure."]], ["p", "Even if the seizure stops quickly, have the child checked by a health professional."]] },
  f7: { title: "Diarrhoea and dehydration", summary: "Give ORS, keep feeding, and spot the signs of dehydration.",
    body: [["h", "What to do"], ["ul", ["Keep breastfeeding and feeding the child.", "Give ORS (oral rehydration salts), prepared with clean water as shown on the sachet, in small frequent sips with a spoon.", "If they vomit, wait 10 minutes then start again slowly.", "Ask a health worker whether to add zinc.", "Wash your hands before preparing the ORS."]], ["h", "Signs of dehydration"], ["ul", ["Dry mouth, no tears, sunken eyes, sunken soft spot on a baby's head.", "Little or no urine, great thirst, or on the contrary a very weak, sleepy child."]], ["h", "Seek care quickly if"], ["ul", ["There is blood in the stools, non-stop vomiting or a high fever.", "The child refuses to drink, is very weak or has the signs above.", "The diarrhoea lasts more than 2 days, or affects a baby under 6 months."]]] },
  f8: { title: "Fall or bump to the head", summary: "Watch the child and recognise the signs that mean going to emergency.",
    body: [["h", "What to do"], ["ul", ["Calm the child, look at the bump and put a cold cloth on it for 10 minutes.", "Keep them close and watch them carefully for 24 hours."]], ["h", "Go to emergency straight away if"], ["ul", ["They lose consciousness, even briefly, or are not themselves (very sleepy, confused, hard to wake).", "They vomit several times, have convulsions or a bad headache.", "Blood or clear fluid comes from the nose or ears.", "The bump is big and soft, the soft spot on a baby's head bulges, or the fall was from a height.", "It is a baby under one year old."]]] },
  f9: { title: "A child has swallowed a product", summary: "Household product, medicine, paraffin: the right reflexes.",
    body: [["h", "What to do"], ["ul", ["Remove what is left of the product from their mouth and move the container away.", "Keep the packaging to show.", "Go straight to a health facility, or have someone call the emergency services, with the packaging.", "Note what they took, the approximate amount and the time."]], ["h", "What not to do"], ["ul", ["Do not make them vomit.", "Do not give milk, oil, salt water or any home remedy, unless a professional advises it.", "Do not wait for signs to appear."]], ["h", "How to prevent it"], ["p", "Keep medicines, household products, paraffin and pesticides out of reach, in their original packaging, never in a water or drink bottle."]] },
  f10: { title: "Snake bite", summary: "Stay calm, keep still and get to a health facility quickly.",
    body: [["h", "What to do"], ["ul", ["Move the child away from the snake and keep them calm and still: moving spreads the venom faster.", "Immobilise the bitten limb as for a fracture, at heart level or lower.", "Remove rings, bracelets and tight clothing before the limb swells.", "Take the child straight to a health facility, carrying them if possible.", "Note the time of the bite and, if safe, what the snake looked like. Do not waste time looking for it."]], ["h", "What not to do"], ["ul", ["Do not apply a tourniquet, cut, suck, or put on any product or plant.", "Do not give alcohol or medicines.", "Do not apply ice."]]] },
});

Object.assign(EN.activities, {
  a1: { title: "Looks and smiles", mat: "none", desc: "Place your face close to your baby's, smile and speak softly.", steps: ["Settle facing your baby, about 20-30 cm away.", "Smile and speak to them in a soft voice.", "Wait for their reaction, then answer."], why: "Strengthens the bond with you and your baby's attention." },
  a2: { title: "A very gentle massage", mat: "none", desc: "Gently massage arms, legs and back while humming.", steps: ["Wash your hands and keep baby warm.", "Use small, slow movements without pressing.", "Stop as soon as they turn away or cry."], why: "Soothes your baby and builds closeness. For a very small baby, ask your health professional first." },
  a3: { title: "Follow the colourful cloth", mat: "a brightly coloured cloth", desc: "Slowly move a colourful cloth in front of their eyes.", steps: ["Hold the cloth 25 cm from their face.", "Move it slowly from left to right.", "Praise them when they follow it with their eyes."], why: "Helps them fix their gaze and follow an object." },
  a4: { title: "Singing together", mat: "none", desc: "Sing a little song to your child and watch their reactions.", steps: ["Choose a song you like.", "Sing it while making gestures with your hands.", "Pause and let them answer with a sound or a gesture."], why: "Stimulates language, rhythm and memory." },
  a5: { title: "Peekaboo with a wrap cloth", mat: "a wrap cloth or a light fabric", desc: "Hide your face behind a cloth, then reappear.", steps: ["Hide your face with the cloth.", "Ask: \"Where is Mummy?\"", "Reappear with a big smile."], why: "Helps them understand that people still exist when they cannot see them." },
  a6: { title: "Boxes to open", mat: "empty, clean boxes, cups", desc: "Let them open, close and fill safe boxes.", steps: ["Choose boxes with no sharp edges or small parts.", "Show how to put an object inside.", "Let them explore, and always stay close."], why: "Develops hand coordination and curiosity." },
  a7: { title: "Stacking cups", mat: "cups or small boxes", desc: "Build a tower then let them knock it down.", steps: ["Stack 2 or 3 cups.", "Invite them to add a cup.", "Laugh together when the tower falls."], why: "Works on steady movements and patience." },
  a8: { title: "A walk of sounds", mat: "none", desc: "Go outside and name what you see and hear.", steps: ["Walk slowly with your child.", "Name things: \"A bird! A motorbike!\"", "Listen together in silence for a few seconds."], why: "Enriches vocabulary and attention." },
  a9: { title: "The animal dance", mat: "none", desc: "Copy the sounds and movements of animals together.", steps: ["Say \"The cat goes miaow!\" and do the gesture.", "Let them copy you.", "Change animal."], why: "Encourages imitation, movement and first words." },
  a10: { title: "The market game", mat: "fruit, vegetables, wrap cloths", desc: "Play at buying and selling with real fruit or vegetables.", steps: ["Set up a small stall.", "Take turns being the seller or the customer.", "Count the fruit together."], why: "Develops language, numbers and role play." },
  a11: { title: "Drawing in the sand", mat: "a patch of clean sand or a slate", desc: "Trace lines, circles and shapes with a stick.", steps: ["Draw a circle or a line.", "Invite them to copy you.", "Tell the story of the drawing with them."], why: "Prepares the hand for writing." },
  a12: { title: "Counting little pebbles", mat: "clean pebbles, too big to be swallowed", desc: "Count pebbles by moving them from one pile to another.", steps: ["Line up 5 pebbles.", "Count them aloud while touching them.", "Ask: \"How many are left?\""], why: "First steps towards numbers." },
  a13: { title: "Telling a story as a family", mat: "none", desc: "Make up a story together, each adding a sentence.", steps: ["Start with \"Once upon a time…\".", "Take turns adding a sentence.", "End with a lesson or a song."], why: "Stimulates imagination and language." },
  a14: { title: "The awalé game", mat: "an awalé board or holes in the ground, seeds", desc: "A traditional game to learn counting and thinking.", steps: ["Put 4 seeds in each hole.", "Take turns sowing the seeds from one hole.", "Count the seeds won at the end."], why: "Strengthens calculation, strategy and respect for rules." },
  a15: { title: "My name in letters", mat: "stick, slate or paper", desc: "Write their name and recognise the letters around you.", steps: ["Write their name in big letters.", "Point to each letter and say its name.", "Look for these letters on a sign or a package."], why: "Awakens interest in reading and writing." },
});

Object.assign(EN.contents, {
  n1: { title: "Enriched porridge with maize, groundnut and soya", summary: "A thick, nourishing porridge made with local products.",
    body: [["p", "For a child from 6 months, in addition to breast milk."], ["h", "Ingredients"], ["ul", ["Maize flour (or millet or sorghum).", "Fine groundnut paste, with no salt or sugar.", "A little well-cooked soya flour, or a well-cooked mashed egg.", "A spoonful of oil (red palm oil if possible).", "Clean water."]], ["h", "Preparation"], ["ul", ["Mix the flour into a little cold water to avoid lumps.", "Pour into boiling water and cook for 15 to 20 minutes, stirring.", "Off the heat, add the groundnut paste, the soya flour and the oil.", "Let it cool a little and serve thick, with a spoon."]], ["h", "Tips"], ["ul", ["The porridge should stay on the spoon without running off.", "Make it fresh every day and throw away leftovers.", "No added sugar or salt.", "Introduce groundnut and egg in small amounts. If the child has severe eczema or a reaction, ask a health worker for advice."]]] },
  n2: { title: "Sweet potato or yam purée with green leaves", summary: "Energy, vitamins and iron: a simple purée with local leaves.",
    body: [["h", "Ingredients"], ["ul", ["Sweet potato or yam.", "Washed green leaves (adémè, gboma, moringa, sweet potato leaves).", "A spoonful of red palm oil or other oil.", "Clean water."]], ["h", "Preparation"], ["ul", ["Peel and cook the sweet potato or yam until soft.", "Cook the leaves for a few minutes, then chop them very finely.", "Mash everything together, add the oil and a little cooking water to make a smooth purée."]], ["p", "For a baby of 6 to 8 months, the purée should be very smooth. For an older child, leave small pieces."]] },
  n3: { title: "Mashed egg or fish with vegetables", summary: "A source of protein and iron, well cooked and mashed.",
    body: [["ul", ["Hard-boil an egg (at least 10 minutes) or cook a small piece of fresh or dried fish, well washed and boneless.", "Cook some vegetables (carrot, pumpkin, leaves).", "Mash together with a fork and add a little cooking water or oil."]], ["h", "Safety"], ["ul", ["Never give raw or barely cooked egg or fish.", "Remove every bone.", "Serve lukewarm, never scalding."]]] },
  n4: { title: "Healthy snacks at home", summary: "Small snacks that nourish without spoiling the appetite.",
    body: [["ul", ["Seasonal fruit in pieces suited to the age: papaya, banana, mango, peeled orange.", "Cooked sweet potato or yam.", "Fine groundnut paste spread thinly (never whole groundnuts before age 4).", "Thick porridge or fermented milk, according to family habits.", "Clean water."]], ["p", "Avoid sweets and sugary drinks every day: they spoil the appetite for meals."]] },
  n5: { title: "When the child is ill: keep feeding them", summary: "Even with a fever or diarrhoea, they still need to drink and eat.",
    body: [["ul", ["Keep breastfeeding, more often if possible.", "Offer small meals, often, of their favourite foods.", "Give drinks often (ORS for diarrhoea).", "After the illness, give one extra meal a day for 2 weeks to catch up."]], ["p", "If the child refuses to drink or eat, or seems very weak, seek care without delay."]] },
  n6: { title: "Is my child eating enough? When to seek care", summary: "The signs that should make you ask a health worker for advice.",
    body: [["p", "PETIT PAS does not say whether a child is well fed: only a professional can tell. Here is what should make you seek advice."], ["ul", ["The child is losing weight, or has not gained weight for several weeks.", "Their feet or face are swelling.", "They are very tired, sad, or their hair is changing colour.", "They refuse to eat for several days.", "You have a doubt about their weight or height."]], ["p", "At the health centre, a worker can weigh and measure the child, and measure the width of their arm with a tape. Note the measurements in PETIT PAS to show them."]] },
  p1: { title: "A safe home for little ones", summary: "The steps that prevent accidents at home.",
    body: [["p", "Most accidents to little ones happen at home and can be prevented."], ["h", "Steps that protect"], ["ul", ["Never leave a child alone near water (bucket, basin, well, river) or near a fire or kitchen.", "Keep hot pots, paraffin lamps, charcoal stoves and matches out of reach.", "Keep medicines, paraffin, pesticides and household products out of reach, in their original packaging.", "Cover or close wells and holes. Put barriers on stairs and windows.", "Have the child sleep under an insecticide-treated mosquito net.", "Keep electric wires and sockets out of reach.", "On the road, hold the child's hand. Avoid carrying a baby on a motorbike; for an older child, a helmet that fits and an adult holding them."]], ["p", "A child under 6 always needs an adult watching over them."]] },
  p2: { title: "Safe places: day-care, school, neighbourhood", summary: "How to choose and watch over the places where your child spends time.",
    body: [["ul", ["Visit the day-care or school before leaving your child there: cleanliness, drinking water, toilets, known staff, number of children per adult.", "Give the list of people allowed to pick up the child.", "Teach the child their first name, their parents' names and, when they can remember it, the number of a trusted adult.", "Tell them their body belongs to them: nobody has the right to touch them or show them anything that makes them uncomfortable, and they can always tell you without being punished.", "Listen when they say they are afraid of someone or somewhere.", "Prefer accompanied trips to school."]], ["h", "Signs that a place is not safe"], ["ul", ["Nobody is watching the children.", "Unknown adults come in freely.", "The child no longer wants to go, cries or changes behaviour for no clear reason."]]] },
  p3: { title: "Children's rights", summary: "The main rights, in simple words.",
    body: [["p", "Children have rights, recognised by the United Nations Convention on the Rights of the Child. Here are the main ones."], ["ul", ["To have a name and an identity: to be registered at birth (birth certificate).", "To be cared for and protected from disease: check-ups, vaccines, good food.", "To be protected from violence, neglect, exploitation and dangerous work.", "To go to school and learn.", "To play, rest and be safe.", "To be listened to and respected, according to their age.", "To grow up with their parents when possible, and to be protected when their family cannot look after them."]], ["p", "A child with a disability has the same rights as any other child."], ["h", "Who can help"], ["p", "Social action workers, health workers, neighbourhood leaders, associations and NGOs can help you make sure these rights are respected."]] },
  p4: { title: "The birth certificate: the right to a name", summary: "Why and how to register your child's birth.",
    body: [["p", "The birth certificate proves the child's identity. It is needed for school, care, social support and, later, identity papers."], ["h", "How to do it"], ["ul", ["Register the birth at the town hall, at the civil registry centre of your commune, within the legal deadline: 45 days according to the 2009 civil registration law.", "Bring the birth certificate issued by the maternity ward or health centre, and your identity papers.", "Ask the town hall or the health centre whether registration is free within this deadline and whether online registration exists in your commune (pilot phase in Lomé).", "If the deadline has passed, do not give up: ask at the town hall or an association about the procedure and about free registration campaigns."]], ["p", "This information comes from public sources: check it with the town hall."]] },
  p5: { title: "Violence and neglect: recognise and act", summary: "The signs that should alert you, and what to do.",
    body: [["h", "Signs that should alert you"], ["ul", ["Repeated or unexplained injuries.", "A child who is very afraid of an adult, who withdraws or suddenly becomes aggressive.", "A child who is dirty, hungry, never cared for or left alone for long periods (neglect).", "A child who no longer wants to go somewhere or who talks about acts that made them uncomfortable.", "A child put to work or on the street, or separated from their family for no clear reason."]], ["h", "What to do"], ["ul", ["Listen calmly. Believe them. Tell them it is not their fault.", "Do not promise to keep it secret: promise to help.", "Take the child to safety, without questioning them again and again.", "Talk to a trusted person: health worker, social action worker, neighbourhood leader, association manager.", "Call the child protection helpline (number to be verified) or go to the police or gendarmerie if the child is in immediate danger.", "If the child is hurt, go to a health facility."]], ["h", "Discipline without violence"], ["ul", ["Slaps, shaking and humiliation hurt and teach nothing.", "Explain the rule calmly, offer a choice, encourage good behaviour.", "If anger rises, step away for a moment, breathe, then come back."]]] },
  p6: { title: "Social support: where to ask for help", summary: "Possible help for families in difficulty.",
    body: [["p", "Families in difficulty may be entitled to support. Programmes change: always ask for up-to-date information."], ["ul", ["A national social protection programme was launched in December 2025, with cash transfers for vulnerable households, paid notably by phone (mobile money).", "Ask at the town hall, the social action worker or the neighbourhood leader whether your household can be registered.", "Health centres can guide you for care, nutrition and vaccines.", "NGOs and associations offer support: see Services › NGOs and social support.", "Keep your papers (birth certificate, health record book): they are needed for any request for help."]]] },
  p7: { title: "Children with disabilities: rights and support", summary: "Rights, early detection and support for the child and their family.",
    body: [["ul", ["Every child has the right to be cared for, to go to school and to play with others.", "Do not hide your child: the earlier they are examined, the earlier they can be helped.", "Tell a health worker about your concerns: development, sight, hearing, movement.", "Ask the health centre or an association of people with disabilities about the nearest rehabilitation and inclusion services.", "Play, talk and sing with them every day: most activities can be adapted.", "Protect them: a child with a disability is more exposed to violence. Teach them to say no and to speak up."]]] },
});

Object.assign(EN.activities, {
  e1: { title: "The sound game", mat: "none", desc: "Play with the sounds of words: it is the first step to learning to read.", steps: ["Say a word (\"mummy\") and ask: \"What sound does it start with?\"", "Look together for other words that start with the same sound.", "Clap your hands to count the syllables of a name."], why: "Hearing sounds and syllables prepares for reading in the first year of primary school." },
  e2: { title: "Tracing in sand or flour", mat: "a patch of clean sand, flour on a tray, a stick", desc: "Trace lines, waves and circles with a finger or a stick.", steps: ["Draw a straight line, a wave, a circle: the child copies you.", "Show how to hold a pencil between thumb and index finger, with the middle finger as support.", "Then move on to pencil and paper or a slate."], why: "Strengthens the fingers and prepares the hand for writing." },
  e3: { title: "Counting to 10 with objects", mat: "10 clean pebbles, seeds (too big to be swallowed) or bottle tops", desc: "Count objects by touching them one by one.", steps: ["Line up the objects and count aloud while touching them.", "Ask: \"Give me 3 pebbles\", then \"How many are left?\"", "Count the steps, the hens, the paces to the door."], why: "Linking a number to a quantity is the basis of mathematics." },
  e4: { title: "Playing school", mat: "a bag, a slate or paper, a pencil", desc: "Play teacher and pupil to get used to the classroom.", steps: ["Pack a small bag with a slate and a pencil.", "Take turns being the teacher (who calls names, tells a story) and the pupil (who raises a hand).", "Learn the routine: say hello, sit down, listen, tidy up."], why: "Knowing the gestures of school is reassuring and reduces fear on the first day." },
  e5: { title: "I do it myself: dressing, washing hands, using the toilet", mat: "easy-to-wear clothes, soap, a bucket of clean water", desc: "Let the child do on their own, patiently, what they will have to do without you at school.", steps: ["Choose clothes that are easy to put on and take off.", "Show the steps, then let them try, even if it is slow.", "Repeat every day: wash hands before eating and after the toilet, put away their bag."], why: "A child who is independent feels at ease and gains confidence at school." },
  e6: { title: "Listen and do", mat: "none", desc: "Give longer and longer instructions to learn to listen and follow them.", steps: ["Give one instruction: \"Pick up the cup.\"", "Move to two instructions: \"Pick up the cup and put it under the chair.\"", "Swap roles: they give you the instructions."], why: "Listening and following instructions is a key skill in class." },
  e7: { title: "Taking turns", mat: "a game with rules (awalé, pebble game) or a ball", desc: "Play a game where you wait your turn, share and accept losing.", steps: ["Explain the rule in one sentence.", "Take turns and say aloud: \"It's your turn, it's my turn.\"", "Praise them as much when they lose as when they win, if they followed the rules."], why: "Waiting, sharing and following a rule prepares for life in a group." },
  e8: { title: "Let's talk about school", mat: "none", desc: "Prepare the first day with simple, reassuring words.", steps: ["Tell them what happens at school: playing, learning, having a teacher and friends.", "If possible, visit the school, the yard and the route together before the start of term.", "Plan a short, warm goodbye, practise it at home, and say when you will come back to pick them up."], why: "Knowing what awaits them and how goodbyes will go reduces separation anxiety." },
});

const Net = { online: true, phase: "online", timers: [] };

  if (on === Net.online && Net.phase === (on ? "online" : "offline")) return;
  Net.timers.forEach(clearTimeout); Net.timers = [];
  Net.online = on;
  if (!on) { Net.phase = "offline"; mark("offline"); log("net_off"); paintNet(); return; }
  mark("online"); log("net_on");

  Net.timers.push(setTimeout(() => { Net.phase = "sync"; paintNet(); }, 1300));
  Net.timers.push(setTimeout(() => { doSync(); Net.phase = "done"; paintNet(); }, 3400));
  Net.timers.push(setTimeout(() => { Net.phase = "online"; paintNet(); }, 6000));
}

function tipOfDay(c) {
  const m = monthsBetween(c.birthDate);
  const pool = CONTENTS.filter(x => x.daily && m >= x.ageMin && m <= x.ageMax);
  if (!pool.length) return CONTENTS.find(x => x.id === "t2");
  return pool[diffDays(c.createdAt.slice(0, 10), todayISO()) % pool.length % pool.length];
}

    ${kids.length > 1 ? `<div class="scroller" role="group" aria-label="Choisir un enfant">${kids.map(k => `<button class="chip" aria-pressed="${k.id === c.id}" data-act="pick-child" data-id="${k.id}">${esc(k.firstName)}</button>`).join("")}</div>` : ""}
    <button class="child-card" data-go="child" data-p="${P({ id: c.id })}" aria-label="Profil de ${esc(c.firstName)}"><span class="avatar" aria-hidden="true">👶</span><span class="cc-main"><span class="cc-name">${esc(c.firstName)}</span><span class="cc-age">${ageLabel(c.birthDate)}</span>${careBadge(c)}</span>${ic("chev")}</button>
    ${isSpecial(c) ? `<button class="care-banner" data-go="special"><span style="font-size:1.6rem" aria-hidden="true">🤝</span><span><b>Suivi particulier</b><span class="s">Mesures, rendez-vous, conseils et ressources réunis pour le suivi à domicile.</span></span>${ic("chev")}</button>` : ""}
    <section class="tip" aria-labelledby="tip-h"><span class="kicker" id="tip-h">Conseil du jour</span><p>${esc(tip.summary)}</p><button class="btn sun" data-go="content" data-p="${P({ id: tip.id })}">Voir le conseil</button></section>
    <section class="stack" aria-labelledby="sv-h"><div class="sec-title"><h2 id="sv-h">Mon suivi</h2></div>
      <div class="grid2">
        <button class="tile a" data-go="suivi" data-p="${P({ tab: "growth" })}"><span class="em" aria-hidden="true">⚖️</span><span class="t">Croissance</span><span class="s">${last ? `Dernière mesure : ${kg(last.weight)}` : "Aucune mesure pour l'instant"}</span></button>
        <button class="tile b" data-go="suivi" data-p="${P({ tab: "notes" })}"><span class="em" aria-hidden="true">🧠</span><span class="t">Développement</span><span class="s">Voir les observations</span></button>

  </div></div>`;

function syncChip(x) { return x.synced === false ? `<span class="badge warn">${ic("clock")}À synchroniser</span>` : ""; }

function suiviGrowth(c) {

const demoNoteInline = () => Repo.me()?.demo ? `<p class="demo-tag">${ic("info")}<span>Données fictives utilisées uniquement pour la démonstration.</span></p>` : "";
function apptRow(a, del = true) {

function vaxStatus(c, v) {

  return weeks >= v.w ? "check" : "soon";
}
function suiviVax(c) {

  return `<div class="notice">${ic("alert")}<span><b>Calendrier indicatif, à valider.</b> Référez-vous toujours au carnet de santé de votre enfant et aux conseils de votre professionnel de santé.</span></div>
  ${groups.map(g => `<section class="card vgroup"><h3>${g}</h3><ul>${VACCINES.filter(v => v.g === g).map(v => { const st = vaxStatus(c, v); return `<li class="li"><div class="grow"><b>${v.name}</b></div><span class="badge ${lab[st][1]}">${st === "done" ? ic("check") : ""}${lab[st][0]}</span><button class="btn sm ${st === "done" ? "ghost" : "soft"}" data-act="vax-toggle" data-id="${v.id}" style="min-height:44px">${st === "done" ? "Retirer" : "Marquer effectué"}</button></li>`; }).join("")}</ul></section>`).join("")}

  return `<section class="card stack" aria-labelledby="ob-h"><h2 id="ob-h">Ajouter une observation</h2>

  ${os.length ? `<section class="card" aria-labelledby="ol-h"><h2 id="ol-h">Mes observations</h2><ul>${os.map(o => `<li class="li"><div class="grow"><span class="tiny">${fmtLong(o.date)} ${o.synced === false ? "· à synchroniser" : ""}</span><p>${esc(o.text)}</p></div><button class="iconbtn" style="width:40px;height:40px" data-act="del-obs" data-id="${o.id}" aria-label="Supprimer cette observation">${ic("trash")}</button></li>`).join("")}</ul></section>` : ""}
  <section class="card" aria-labelledby="mi-h"><h2 id="mi-h">Repères à observer vers ${ms.max > 900 ? "4–6 ans" : ms.min + "–" + ms.max + " mois"}</h2>

      <div class="btn-row"><button class="btn soft sm" data-go="suivi" data-p="${P({ tab: "growth" })}" style="flex:1">Voir l'évolution</button><button class="btn sm" data-go="measure" data-p="{}" style="flex:1">${ic("plus")}Ajouter</button></div></section>

      <ul>${tips.map(t => `<li class="li"><button class="grow" style="background:none;border:0;text-align:left;padding:0" data-go="content" data-p="${P({ id: t.id })}"><b>${esc(t.title)}</b><span class="small muted">${trStr(t.category)} · ${t.readMin} min</span></button>${ic("chev", "end")}</li>`).join("")}</ul></section>

      <ul>${res.map(t => `<li class="li"><button class="grow" style="background:none;border:0;text-align:left;padding:0" data-go="content" data-p="${P({ id: t.id })}"><b>${esc(t.title)}</b><span class="small muted">${trStr(t.kind)} · ${t.readMin} min</span></button>${isDl(t.id) ? `<span class="badge ok">${ic("check")}Téléchargé</span>` : ""}</li>`).join("")}</ul></section>

const actAgeFor = c => { const m = c ? monthsBetween(c.birthDate) : 0; return (ACT_AGES.find(a => m >= a.min && m <= a.max) || ACT_AGES[ACT_AGES.length - 1]).id; };
